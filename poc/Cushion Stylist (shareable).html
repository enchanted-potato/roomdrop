document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box;}\n    html,body{margin:0;padding:0;}\n    ::selection{background:#e7c9b3;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f1ebe1;font-family:'Mulish',sans-serif;color:#3a332c;display:flex;flex-direction:column;\">\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:#fbf8f2;border-bottom:1px solid #e4dccf;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:#c17a52;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Marcellus',serif;font-size:18px;\">C<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Marcellus',serif;font-size:21px;letter-spacing:.2px;line-height:1;\">Cushion Stylist<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a8f7f;margin-top:3px;\">Style your sofa, one cushion at a time<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;\">\n      <button onclick=\"{{ clearPlaced }}\" style=\"font-family:'Mulish',sans-serif;font-size:13px;font-weight:600;color:#7a6f5f;background:transparent;border:1px solid #e4dccf;border-radius:8px;padding:9px 16px;cursor:pointer;\">Clear sofa<\u002Fbutton>\n      <button onclick=\"{{ resetRoom }}\" style=\"font-family:'Mulish',sans-serif;font-size:13px;font-weight:600;color:#7a6f5f;background:transparent;border:1px solid #e4dccf;border-radius:8px;padding:9px 16px;cursor:pointer;\">New room<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1;display:flex;min-height:0;\">\n\n    <!-- ===== STAGE ===== -->\n    <main style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;min-width:0;\">\n\n      <sc-if value=\"{{ hasRoom }}\" hint-placeholder-val=\"{{ false }}\">\n        <div ref=\"{{ canvasRef }}\" style=\"position:relative;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px -18px rgba(58,51,44,.4);background:#000;line-height:0;max-width:100%;max-height:72vh;\">\n          <img ref=\"{{ roomImgRef }}\" draggable=\"false\" style=\"display:block;max-width:78vw;max-height:72vh;width:auto;height:auto;user-select:none;\">\n\n          <sc-for list=\"{{ placed }}\" as=\"c\" hint-placeholder-count=\"0\">\n            <div data-placed-id=\"{{ c.id }}\" style=\"position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;width:{{ c.w }}px;height:{{ c.h }}px;box-sizing:border-box;padding:{{ c.pad }};transform:translate(-50%,-50%) rotate({{ c.rot }}deg);z-index:{{ c.z }};cursor:grab;touch-action:none;border-radius:{{ c.radius }};background:{{ c.frameBg }};box-shadow:{{ c.shadow }};outline:{{ c.outline }};outline-offset:3px;transition:outline .12s;\">\n              <div style=\"width:100%;height:100%;border-radius:{{ c.innerRadius }};overflow:hidden;background:{{ c.bg }};\"><div style=\"{{ c.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"position:absolute;left:0;bottom:0;right:0;padding:10px 14px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none;\">{{ hint }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noRoom }}\" hint-placeholder-val=\"{{ true }}\">\n        <label style=\"width:560px;max-width:80vw;height:340px;border:2px dashed #cdbfa8;border-radius:16px;background:#fbf8f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;text-align:center;\">\n          <input type=\"file\" accept=\"image/*\" onchange=\"{{ onRoomFile }}\" style=\"display:none;\">\n          <div style=\"width:54px;height:54px;border-radius:14px;background:#f0e4d6;display:flex;align-items:center;justify-content:center;font-size:24px;\">🛋️<\u002Fdiv>\n          <div style=\"font-family:'Marcellus',serif;font-size:22px;\">Upload a photo of your living room<\u002Fdiv>\n          <div style=\"font-size:14px;color:#9a8f7f;max-width:360px;\">A clear shot of your sofa works best. Then drag cushions from the library onto it.<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:13px;font-weight:700;color:#fff;background:#c17a52;padding:10px 20px;border-radius:9px;\">Choose photo<\u002Fdiv>\n        <\u002Flabel>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n\n    <!-- ===== LIBRARY ===== -->\n    <aside style=\"width:312px;flex:none;background:#fbf8f2;border-left:1px solid #e4dccf;display:flex;flex-direction:column;min-height:0;\">\n      <div style=\"padding:20px 22px 14px;border-bottom:1px solid #ece4d6;\">\n        <div style=\"font-family:'Marcellus',serif;font-size:18px;\">Cushion library<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a8f7f;margin-top:3px;\">Drag a cushion onto the sofa<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow-y:auto;padding:18px 22px;\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n          <label style=\"aspect-ratio:1;border:2px dashed #cdbfa8;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#a8987f;\">\n            <input type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onCushionFiles }}\" style=\"display:none;\">\n            <div style=\"font-size:24px;line-height:1;\">＋<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;\">Add photos<\u002Fdiv>\n          <\u002Flabel>\n\n          <sc-for list=\"{{ library }}\" as=\"c\" hint-placeholder-count=\"0\">\n            <div draggable=\"true\" data-lib-id=\"{{ c.id }}\" title=\"Drag onto sofa\" style=\"aspect-ratio:1;border-radius:13px;overflow:hidden;cursor:grab;background:{{ c.bg }};box-shadow:0 4px 12px -5px rgba(58,51,44,.4);border:1px solid rgba(0,0,0,.05);\"><div style=\"{{ c.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:14px;font-size:12px;color:#b3a890;line-height:1.6;\">Tip: drag the same cushion more than once to use it in several spots.<\u002Fdiv>\n\n        <div style=\"margin:24px 0 14px;display:flex;align-items:center;gap:10px;\">\n          <div style=\"font-family:'Marcellus',serif;font-size:16px;color:#3a332c;\">Furniture &amp; decor<\u002Fdiv>\n          <div style=\"flex:1;height:1px;background:#ece4d6;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n          <label style=\"aspect-ratio:1;border:2px dashed #cdbfa8;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#a8987f;\">\n            <input type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onFurnitureFiles }}\" style=\"display:none;\">\n            <div style=\"font-size:24px;line-height:1;\">＋<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;\">Add furniture<\u002Fdiv>\n          <\u002Flabel>\n\n          <sc-for list=\"{{ furnitureLibrary }}\" as=\"c\" hint-placeholder-count=\"0\">\n            <div draggable=\"true\" data-lib-id=\"{{ c.id }}\" title=\"Drag into the room\" style=\"aspect-ratio:1;border-radius:13px;overflow:hidden;cursor:grab;background:{{ c.bg }};box-shadow:0 4px 12px -5px rgba(58,51,44,.4);border:1px solid rgba(0,0,0,.05);\"><div style=\"{{ c.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:12px;color:#b3a890;line-height:1.6;\">Upload a chair, lamp, plant — anything. Pick the background color to remove, then drag it into the room.<\u002Fdiv>\n\n        <div style=\"margin:24px 0 14px;display:flex;align-items:center;gap:10px;\">\n          <div style=\"font-family:'Marcellus',serif;font-size:16px;color:#3a332c;\">Wall art<\u002Fdiv>\n          <div style=\"flex:1;height:1px;background:#ece4d6;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n          <label style=\"aspect-ratio:1;border:2px dashed #cdbfa8;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#a8987f;\">\n            <input type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onArtFiles }}\" style=\"display:none;\">\n            <div style=\"font-size:24px;line-height:1;\">＋<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;\">Add painting<\u002Fdiv>\n          <\u002Flabel>\n\n          <sc-for list=\"{{ artLibrary }}\" as=\"c\" hint-placeholder-count=\"0\">\n            <div draggable=\"true\" data-lib-id=\"{{ c.id }}\" title=\"Drag onto the wall\" style=\"aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:grab;background:{{ c.bg }};box-shadow:0 4px 12px -5px rgba(58,51,44,.4);border:3px solid #2a2622;\"><div style=\"{{ c.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:12px;color:#b3a890;line-height:1.6;\">Drag a painting onto the wall, then resize it to fit.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <!-- ===== SELECTION TOOLBAR ===== -->\n  <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fbf8f2;border:1px solid #e4dccf;border-radius:14px;box-shadow:0 14px 40px -12px rgba(58,51,44,.45);padding:12px 16px;display:flex;align-items:center;gap:18px;z-index:50;\">\n      <div style=\"display:flex;flex-direction:column;gap:3px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:.6px;color:#a8987f;text-transform:uppercase;\">Size<\u002Fspan>\n        <input type=\"range\" min=\"60\" max=\"560\" value=\"{{ selW }}\" oninput=\"{{ onSize }}\" style=\"width:130px;accent-color:#c17a52;\">\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:3px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:.6px;color:#a8987f;text-transform:uppercase;\">Rotate<\u002Fspan>\n        <input type=\"range\" min=\"-60\" max=\"60\" value=\"{{ selRot }}\" oninput=\"{{ onRotate }}\" style=\"width:110px;accent-color:#c17a52;\">\n      <\u002Fdiv>\n      <div style=\"width:1px;height:34px;background:#e4dccf;\"><\u002Fdiv>\n      <sc-if value=\"{{ selCanCut }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ toggleCut }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:8px 12px;cursor:pointer;\">{{ cutLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <button onclick=\"{{ sendBack }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:8px 12px;cursor:pointer;\">Back<\u002Fbutton>\n      <button onclick=\"{{ bringFront }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:8px 12px;cursor:pointer;\">Front<\u002Fbutton>\n      <button onclick=\"{{ deleteSel }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:700;color:#fff;background:#b5573f;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;\">Remove<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== BACKGROUND REMOVER ===== -->\n  <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(40,34,28,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;\">\n      <div style=\"background:#fbf8f2;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);width:700px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"padding:18px 24px;border-bottom:1px solid #ece4d6;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;\">\n          <div>\n            <div style=\"font-family:'Marcellus',serif;font-size:20px;\">Remove background<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#9a8f7f;margin-top:4px;\">Click any background area to erase that color — click more spots to clean up leftovers.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#b3a890;white-space:nowrap;padding-top:4px;\">{{ editProgress }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-height:0;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;background:#efe7da;\">\n          <div style=\"background-image:linear-gradient(45deg,#d4c7b2 25%,transparent 25%),linear-gradient(-45deg,#d4c7b2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4c7b2 75%),linear-gradient(-45deg,transparent 75%,#d4c7b2 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;border-radius:10px;box-shadow:0 8px 24px -10px rgba(0,0,0,.45);line-height:0;max-width:100%;\">\n            <canvas ref=\"{{ editCanvasRef }}\" onclick=\"{{ onEditClick }}\" style=\"display:block;max-width:100%;max-height:52vh;cursor:crosshair;border-radius:10px;\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px 24px;border-top:1px solid #ece4d6;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:10px;font-weight:700;letter-spacing:.6px;color:#a8987f;text-transform:uppercase;\">Tolerance · {{ editTol }}<\u002Fspan>\n            <input type=\"range\" min=\"6\" max=\"140\" value=\"{{ editTol }}\" oninput=\"{{ onEditTol }}\" style=\"width:150px;accent-color:#c17a52;\">\n          <\u002Fdiv>\n          <button onclick=\"{{ editAuto }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:9px 13px;cursor:pointer;\">Auto detect<\u002Fbutton>\n          <button onclick=\"{{ editUndo }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:9px 13px;cursor:pointer;\">Undo<\u002Fbutton>\n          <button onclick=\"{{ editReset }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:#f1ebe1;border:1px solid #e4dccf;border-radius:8px;padding:9px 13px;cursor:pointer;\">Reset<\u002Fbutton>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <button onclick=\"{{ editCancel }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:600;color:#7a6f5f;background:transparent;border:1px solid #e4dccf;border-radius:8px;padding:9px 15px;cursor:pointer;\">Skip<\u002Fbutton>\n          <button onclick=\"{{ editConfirm }}\" style=\"font-family:'Mulish',sans-serif;font-size:12px;font-weight:700;color:#fff;background:#c17a52;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;\">Add to room<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    roomImage: null,\n    library: [\n      { id: 'p1', bg: '#c8794e' },\n      { id: 'p2', bg: 'repeating-linear-gradient(45deg,#7d8b6a 0 14px,#6d7a5b 14px 28px)' },\n      { id: 'p3', bg: '#d9b382' },\n      { id: 'p4', bg: 'repeating-linear-gradient(0deg,#b5573f 0 12px,#a64d37 12px 24px)' },\n      { id: 'p5', bg: '#506b6b' },\n    ],\n    art: [],          // uploaded paintings for the wall\n    furniture: [],    // uploaded furniture/decor (background removed, free aspect)\n    placed: [],\n    selId: null,\n    editing: null,    // active background-remover modal\n    dragSrc: null,   // library item being dragged to canvas\n  };\n  _seq = 1;\n\n\n  componentDidMount() {\n    this._move = (e) => {\n      if (!this._drag) return;\n      const r = this._canvas.getBoundingClientRect();\n      const x = Math.max(0, Math.min(r.width, e.clientX - r.left - this._drag.dx));\n      const y = Math.max(0, Math.min(r.height, e.clientY - r.top - this._drag.dy));\n      this.setState(s => ({ placed: s.placed.map(p => p.id === this._drag.id ? { ...p, x, y } : p) }));\n    };\n    this._up = () => { this._drag = null; };\n    window.addEventListener('pointermove', this._move);\n    window.addEventListener('pointerup', this._up);\n\n    // Drag from library/art: bound natively so it survives standalone bundling\n    // (compound React event names like onDragStart don't survive HTML re-serialization).\n    this._dragStartH = (e) => {\n      const el = e.target && e.target.closest ? e.target.closest('[data-lib-id]') : null;\n      if (!el) return;\n      const id = el.getAttribute('data-lib-id');\n      const c = this.state.library.find(l => l.id === id) || this.state.art.find(a => a.id === id) || this.state.furniture.find(a => a.id === id);\n      if (!c) return;\n      this._dragSrc = c;\n      if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'copy'; try { e.dataTransfer.setData('text/plain', id); } catch (_) {} }\n    };\n    document.addEventListener('dragstart', this._dragStartH);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('pointermove', this._move);\n    window.removeEventListener('pointerup', this._up);\n    document.removeEventListener('dragstart', this._dragStartH);\n  }\n\n  _handleDrop(e) {\n    let c = this._dragSrc;\n    if (!c) { let id = ''; try { id = e.dataTransfer.getData('text/plain'); } catch (_) {} c = this.state.library.find(l => l.id === id) || this.state.art.find(l => l.id === id) || this.state.furniture.find(l => l.id === id); }\n    if (!c) return;\n    const r = this._canvas.getBoundingClientRect();\n    const x = e.clientX - r.left, y = e.clientY - r.top;\n    const id = 'c' + (this._seq++);\n    const maxZ = this.state.placed.reduce((m, p) => Math.max(m, p.z), 0);\n    const isArt = c.type === 'art';\n    const isFurn = c.type === 'furniture';\n    this.setState(st => ({\n      placed: [...st.placed, { id, type: c.type || 'cushion', aspect: c.aspect || 0.72, bg: c.bg || '', imgSrc: c.imgSrc || '', cutSrc: c.cutSrc, rawSrc: c.rawSrc, cut: !isArt, x, y, w: isArt ? 200 : (isFurn ? 190 : 120), rot: 0, z: maxZ + 1 }],\n      selId: id,\n    }));\n    this._dragSrc = null;\n  }\n\n  _startPlacedDrag(pid, e) {\n    const p = this.state.placed.find(x => x.id === pid); if (!p) return;\n    const r = this._canvas.getBoundingClientRect();\n    this._drag = { id: p.id, dx: e.clientX - r.left - p.x, dy: e.clientY - r.top - p.y };\n    if (e.target.setPointerCapture) { try { e.target.setPointerCapture(e.pointerId); } catch (_) {} }\n    this.setState({ selId: p.id });\n  }\n\n  // Edge-stop background removal: flood inward from the border through smooth\n  // regions (background AND its soft shadow) and stop only at the strongest\n  // colour change — the cushion outline. Shadows get removed; the cushion stays.\n  cutoutWhite(file, cb) {\n    const img = new Image();\n    img.onload = () => {\n      try {\n        const max = 800;\n        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));\n        const w = Math.max(1, Math.round(img.naturalWidth * scale));\n        const h = Math.max(1, Math.round(img.naturalHeight * scale));\n        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;\n        const ctx = cv.getContext('2d');\n        ctx.drawImage(img, 0, 0, w, h);\n        const idata = ctx.getImageData(0, 0, w, h); const d = idata.data;\n        const N = w * h;\n\n        // 1) luminance, lightly box-blurred to suppress fabric/wall noise\n        const lum = new Float32Array(N);\n        for (let i = 0; i < N; i++) { const o = i * 4; lum[i] = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2]; }\n        const blur = new Float32Array(N);\n        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n          let s = 0, n = 0;\n          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {\n            const nx = x + dx, ny = y + dy;\n            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;\n            s += lum[ny * w + nx]; n++;\n          }\n          blur[y * w + x] = s / n;\n        }\n\n        // 2) Sobel gradient magnitude = how fast colour is changing at each pixel\n        const mag = new Float32Array(N);\n        let maxMag = 0;\n        for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {\n          const i = y * w + x;\n          const gx = (blur[i - w + 1] + 2 * blur[i + 1] + blur[i + w + 1]) - (blur[i - w - 1] + 2 * blur[i - 1] + blur[i + w - 1]);\n          const gy = (blur[i + w - 1] + 2 * blur[i + w] + blur[i + w + 1]) - (blur[i - w - 1] + 2 * blur[i - w] + blur[i - w + 1]);\n          const m = Math.sqrt(gx * gx + gy * gy);\n          mag[i] = m; if (m > maxMag) maxMag = m;\n        }\n        // edge threshold relative to the strongest change in the image\n        const edge = Math.max(28, maxMag * 0.16);\n\n        // 3) flood from the border; cross into a pixel only while the change there\n        //    is gentle. The cushion's sharp outline halts the fill.\n        const visited = new Uint8Array(N);\n        const stack = [];\n        const push = (x, y) => {\n          if (x < 0 || y < 0 || x >= w || y >= h) return;\n          const i = y * w + x; if (visited[i]) return;\n          visited[i] = 1;\n          if (mag[i] < edge) { d[i * 4 + 3] = 0; stack.push(i); }\n        };\n        for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }\n        for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }\n        while (stack.length) {\n          const i = stack.pop(); const x = i % w, y = (i / w) | 0;\n          push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);\n        }\n\n        // safety: if almost everything (or almost nothing) was removed, bail out\n        let cleared = 0; for (let i = 0; i < N; i++) if (d[i * 4 + 3] === 0) cleared++;\n        const frac = cleared / N;\n        if (frac < 0.03 || frac > 0.97) { cb(null); return; }\n\n        // 4) feather: soften the 1px boundary between kept and removed pixels\n        const alpha = new Uint8ClampedArray(N);\n        for (let i = 0; i < N; i++) alpha[i] = d[i * 4 + 3];\n        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n          const i = y * w + x;\n          if (alpha[i] === 0) continue;\n          let transparentN = 0;\n          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {\n            const nx = x + dx, ny = y + dy;\n            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;\n            if (alpha[ny * w + nx] === 0) transparentN++;\n          }\n          if (transparentN >= 5) d[i * 4 + 3] = 120;\n        }\n\n        ctx.putImageData(idata, 0, 0);\n        cv.toBlob(b => cb(b ? URL.createObjectURL(b) : null), 'image/png');\n      } catch (err) { cb(null); }\n    };\n    img.onerror = () => cb(null);\n    img.src = URL.createObjectURL(file);\n  }\n\n  // ===== Interactive background remover =====\n  openEditor(files) {\n    this._editTotal = files.length;\n    this._editQueue = [...files];\n    this._nextEditor();\n  }\n  _nextEditor() {\n    if (!this._editQueue || !this._editQueue.length) { this.setState({ editing: null }); return; }\n    const f = this._editQueue[0];\n    this._editRawUrl = URL.createObjectURL(f);\n    const img = new Image();\n    img.onload = () => {\n      const max = 760;\n      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));\n      const w = Math.max(1, Math.round(img.naturalWidth * scale));\n      const h = Math.max(1, Math.round(img.naturalHeight * scale));\n      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;\n      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);\n      this._editOrig = ctx.getImageData(0, 0, w, h);\n      this._editWork = ctx.createImageData(w, h); this._editWork.data.set(this._editOrig.data);\n      this._editW = w; this._editH = h; this._editAspect = h / w;\n      this._editHistory = [];\n      const idx = this._editTotal - this._editQueue.length;\n      this.setState({ editing: { tol: 36, total: this._editTotal, idx } }, () => this._autoRemove());\n    };\n    img.onerror = () => { this._editQueue.shift(); this._nextEditor(); };\n    img.src = this._editRawUrl;\n  }\n  _paintEditor() {\n    const cv = this._editCanvas; if (!cv || !this._editWork) return;\n    cv.width = this._editW; cv.height = this._editH;\n    cv.getContext('2d').putImageData(this._editWork, 0, 0);\n  }\n  _pushHistory() {\n    if (!this._editWork) return;\n    const a = new Uint8ClampedArray(this._editW * this._editH);\n    const d = this._editWork.data;\n    for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];\n    this._editHistory.push(a);\n    if (this._editHistory.length > 24) this._editHistory.shift();\n  }\n  _floodRemoveAt(sx, sy, tol) {\n    const w = this._editW, h = this._editH, d = this._editWork.data;\n    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;\n    const i0 = (sy * w + sx) * 4;\n    if (d[i0 + 3] === 0) return;\n    const tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];\n    const t2 = tol * tol;\n    const seen = new Uint8Array(w * h);\n    const start = sy * w + sx;\n    const st = [start]; seen[start] = 1;\n    while (st.length) {\n      const i = st.pop(); const o = i * 4;\n      const dr = d[o] - tr, dg = d[o + 1] - tg, db = d[o + 2] - tb;\n      if (dr * dr + dg * dg + db * db > t2) continue;\n      d[o + 3] = 0;\n      const x = i % w, y = (i / w) | 0;\n      if (x + 1 < w && !seen[i + 1]) { seen[i + 1] = 1; st.push(i + 1); }\n      if (x - 1 >= 0 && !seen[i - 1]) { seen[i - 1] = 1; st.push(i - 1); }\n      if (y + 1 < h && !seen[i + w]) { seen[i + w] = 1; st.push(i + w); }\n      if (y - 1 >= 0 && !seen[i - w]) { seen[i - w] = 1; st.push(i - w); }\n    }\n  }\n  _onEditClick(e) {\n    const cv = this._editCanvas; if (!cv) return;\n    const r = cv.getBoundingClientRect();\n    const x = Math.floor((e.clientX - r.left) / r.width * this._editW);\n    const y = Math.floor((e.clientY - r.top) / r.height * this._editH);\n    this._pushHistory();\n    this._floodRemoveAt(x, y, this.state.editing.tol);\n    this._paintEditor();\n  }\n  _autoRemove() {\n    if (!this._editWork) return;\n    this._pushHistory();\n    const w = this._editW, h = this._editH;\n    const tol = this.state.editing ? this.state.editing.tol : 36;\n    const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]];\n    for (const c of corners) this._floodRemoveAt(c[0], c[1], tol);\n    this._paintEditor();\n  }\n  _undo() {\n    if (!this._editHistory || !this._editHistory.length) return;\n    const a = this._editHistory.pop();\n    const d = this._editWork.data;\n    for (let i = 0; i < a.length; i++) d[i * 4 + 3] = a[i];\n    this._paintEditor();\n  }\n  _reset() {\n    this._editWork.data.set(this._editOrig.data);\n    this._editHistory = [];\n    this._paintEditor();\n  }\n  _featherEdit() {\n    const w = this._editW, h = this._editH, d = this._editWork.data, N = w * h;\n    const alpha = new Uint8ClampedArray(N);\n    for (let i = 0; i < N; i++) alpha[i] = d[i * 4 + 3];\n    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n      const i = y * w + x;\n      if (alpha[i] === 0) continue;\n      let tn = 0;\n      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {\n        const nx = x + dx, ny = y + dy;\n        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;\n        if (alph
